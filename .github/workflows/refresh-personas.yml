name: Refresh persona shelves

# Weekly, Mondays at 06:30 UTC — deliberately hours after the nightly feed
# import (03:17, up to ~3h) so the curator picks from a freshly synced
# catalogue rather than racing it.
#
# Weekly is enough: a persona shelf is identical for every visitor, and the page
# rotates its window daily from the stored picks without calling the model again.
# The whole run is roughly $1.
#
# Required repository secrets:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY
#
# No Anthropic API key: the job authenticates with Workload Identity Federation.
# GitHub mints an OIDC token for the run, the SDK exchanges it for a short-lived
# Anthropic token, so there is nothing to rotate. Static keys kept dying on us
# (revoked Aug 24, then a workspace-less replacement) and the shelves went
# unrefreshed for six weeks. Required repository variables (IDs, not secrets):
#   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
#   ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID
# The federation rule only matches refs/heads/master of this repo, so branch and
# PR runs can't authenticate.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated persona slugs (blank = all active)"
        required: false
        default: ""

# refreshPersona() deletes a persona's picks before inserting the new set, so an
# overlapping run could leave a shelf empty.
concurrency:
  group: refresh-personas
  cancel-in-progress: false

# id-token: write is what lets the job request a GitHub OIDC token at all.
permissions:
  id-token: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Normally ~4 minutes for six personas, but two calls in one run took 16
    # minutes each (API-side retries), so the ceiling is deliberately generous.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Curate persona shelves
        # GitHub's OIDC token lives ~5 minutes and each one is single-use (jti),
        # but the SDK re-reads the token file whenever it refreshes the Anthropic
        # token (~10 min lifetime) and one run can take far longer than that. So
        # a background loop keeps a fresh, unused token in the file for the
        # whole run. Written via mv so the SDK never reads a half-written file.
        run: |
          fetch_token() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token
          ( while sleep 120; do fetch_token || echo "::warning::OIDC token refresh failed"; done ) &
          pnpm tsx scripts/refresh-personas.ts ${{ github.event.inputs.slugs }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc.jwt
